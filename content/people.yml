- name: Dr A. Zarkali
  role: Principal Investigator
  initials: AZ
  photo: ''
  photo_alt: Portrait of Dr A. Zarkali
  bio: I am a neurologist with an interest in cognitive neurology and movement disorders. 
     My clinical and research interest is the aetiology, diagnosis and treatment of Lewy Body Disease. 
     Specifically, my research aims to shed light on the brain circuits responsible for cognitive decline in Lewy body disease 
     and use non-invasive stimulation as a novel approach to treatment.
     a.zarkali [at] ucl.ac.uk
