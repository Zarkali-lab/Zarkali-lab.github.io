current_members:
- name: Dr Angelika Zarkali
  role: Principal Investigator
  initials: AZ
  photo: '/assets/img/people/AZ.jpg'
  photo_alt: Portrait of Dr A. Zarkali
  bio: >-
    Angelika is a neurologist with an interest in cognitive neurology and movement disorders. Her clinical and research interest is the aetiology, diagnosis and treatment of Lewy Body Disease. Specifically, her research aims to shed light on the brain circuits responsible for cognitive decline in Lewy body disease and use non-invasive stimulation as a novel approach to treatment.
  email: 'a.zarkali [at] ucl.ac.uk'
  links:
  - label: UCL profile
    href: 'https://profiles.ucl.ac.uk/52414-angelika-zarkali'
  - label: ORCID
    href: 'https://orcid.org/0000-0003-2808-072X'
