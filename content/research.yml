areas:
- title: Stimulating brain circuits to treat Parkinson's dementia (Stim PD)
  summary: ''
  detail: We use multimodal neuroimaging techniques in different populations of people with Parkinson's disease, to identify circuits responsible for Parkinson's dementia, and apply novel non-invasive ultrasound stimulation on those circuits to improve cognition. By combining multiple sources of information from large numbers of people with Parkinson's, we will be able to select the best target for non-invasive stimulation of these brain circuits. We will then apply ultrasound stimulation to this target in 50 people with Parkinson's disease.
  tags:
  - neuroimaging informed stimulation
  - connectomics
  - focused ultrasound
  concept_image: '/assets/img/fus.png'
  concept_alt: ''
  funders:
  - logo: '/assets/img/UKRI logo.png'
    name: UKRI

- title: Boosting cognition in Lewy body disease using focused ultrasound
  summary: ''
  detail: Alterations in acetylcholinergic transmission play a key role in Lewy body dementia. We investigate the potential of focused ultrasound of the nucleus basalis of Meynert, the main source of acetylcholine in the brain, as a symptomatic treatment to improve cognition and its effects on brain functional connectivity and metabolism. In collaboration with Oxford University.
  tags:
  - focused ultrasound
  - rsFMRI
  - MRSI
  concept_image: '/assets/img/nbm.png'
  concept_alt: ''
  funders:
  - logo: '/assets/img/raceagainstdementia logo.png'
    name: Race Against Dementia
  - logo: '/assets/img/RosetreesLogo.png'
    name: Rosetrees Trust

- title: Magnetic resonance spectroscopy in Lewy body dementia
  summary: Validate MRSI as a potential biomarker in LBD (cross projects).
  detail: We assess whether 7T MRSI-derived choline can be used as a surrogate biomarker of acetylcholine in dementias. We explore the effect of drug manipulation on repeated measurements in health as well as the technique's ability to capture differences in cognitive severity in disease.
  tags:
  - MRSI
  - acetylcholine
  - biomarker
  concept_image: '/assets/img/MRSIcho.png'
  concept_alt: ''
  funders:
  - logo: '/assets/img/RosetreesLogo.png'
    name: Rosetrees Trust

- title: Biomarkers to track disease severity and disentangle specific pathologies
  summary: ''
  detail: Significant heterogeneity in disease course and underlying pathology poses a unique challenge in LBD. We aim to disentangle that heterogeneity by evaluating different imaging biomarkers in LBD.
  tags:
  - quantitative MRI
  - diffusion weighted imaging
  - MRSI
  concept_image: '/assets/img/brain-single.png'
  concept_alt: ''
  funders:
  - logo: '/assets/img/PUK logo.svg'
    name: Parkinson's UK
  - logo: '/assets/img/ARUKlogo.png'
    name: Alzheimer's Research UK

# Past projects use exactly the same fields as current projects.
past_projects:
- title: Understanding the neural circuits of visual hallucinations and cognitive fluctuations in Lewy body disease
  summary: ''
  detail: >-
    Transient symptoms such as visual hallucinations and cognitive fluctuations are characteristic of Lewy body disease, cause significant distress and limit use of treatments for motor symptoms. We aimed to understand the structural and functional neural correlates of visual hallucinations and cognitive fluctuations in LBD. We showed that hallucinations are associated with an overweighting of prior knowledge together with visuo-spatial dysfunction and showed that this imbalance occurs higher in the cortical hierarchy.
  tags:
  - computational modelling
  - laminar fMRI
  - diffusion weighted imaging
  - dynamic functional connectivity
  concept_image: '/assets/img/hallucinations-concept.png'
  concept_alt: ''
  funders:
  - logo: '/assets/img/PUK logo.svg'
    name: Parkinson's UK
  - logo: '/assets/img/ARUKlogo.png'
    name: Alzheimer's Research UK
