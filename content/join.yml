current_opportunities: |
  We are currently looking for MSc/MRes students in cognitive neuroscience, psychology or AI enrolled at UCL who want to do their 2026/2027 project in the lab. Please get in touch with Angelika directly to discuss the possibilities.

phd_students: |
  There are currently no PhD openings in the lab. However, UCL hosts a number of centrally funded PhD programs, which could give you the option of doing your PhD at the lab, including but not limited to:

  - [UCL-RES](https://www.ucl.ac.uk/scholarships/research-excellence-scholarship)
  - [LiDO DTP](https://www.lido-dtp.ac.uk/)
  - [UCL Birkbeck MRC DTP](https://www.uclbbk-mrcdtp.ac.uk/)

  For programs that do not require you to name a primary supervisor yet, the usual route is to apply direct to these programs and if you gain a place and are interested in a rotation placement in the lab (with a view to potential PhD supervision), get in touch with Angelika. For the programs that require you to name a primary supervisor and/or submit a research proposal, get in touch with Angelika first to check the fit with the lab.

postdoctoral_researchers: |
  A postdoctoral fellow post will be advertised shortly (start date Jan 2027).

  Angelika is also happy to discuss potential fellowship applications, academic visits or postdoctoral projects – please get in touch with a CV and details of your research interests.

undergraduate_masters_students: |
  Undergraduate and Masters project opportunities in the lab are advertised by each specific course in the early summer / autumn of each year respectively and you will need to apply directly through the course portal.

  If you are a Masters student at UCL and interested in one of the projects in the lab please get in touch with Angelika with your CV as soon as possible.
