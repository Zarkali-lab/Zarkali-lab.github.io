<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page_description or site.description }}">
  <meta name="theme-color" content="#ffffff">
  <title>{% if title %}{{ title }} · {% endif %}{{ site.name }}</title>
  <link rel="icon" href="{{ url('/assets/img/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url('/assets/css/style.css') }}">
  <script>document.documentElement.dataset.theme=localStorage.getItem('zarkali-theme')||'light';</script>
</head>
<body class="page-{{ page_key or 'default' }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" data-header>
    <div class="nav-shell">
      <a class="brand" href="{{ url('/') }}" aria-label="{{ site.name }} home">
        <span class="brand-mark" aria-hidden="true">AZ</span>
        <span>{{ site.short_name }}</span>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-menu-toggle>
        <span></span><span></span><span class="sr-only">Toggle navigation</span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Primary" data-site-nav>
        {% for item in site.nav %}
          <a href="{{ url(item.href) }}" {% if active_nav == item.label %}aria-current="page"{% endif %}>{{ item.label }}</a>
        {% endfor %}
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle colour theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="main">{% block content %}{% endblock %}</main>

  <footer class="site-footer simple-footer">
    <div class="simple-footer-inner section-pad">
      <span>Dementia Research Centre · University College London</span>
      <a class="github-icon-link" href="{{ site.github }}" aria-label="Zarkali Lab on GitHub" title="Zarkali Lab on GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C6.48 2 2 6.58 2 12.22c0 4.51 2.87 8.34 6.84 9.69.5.09.68-.22.68-.49 0-.24-.01-1.04-.01-1.89-2.78.62-3.37-1.21-3.37-1.21-.45-1.18-1.11-1.49-1.11-1.49-.91-.64.07-.63.07-.63 1 .08 1.53 1.05 1.53 1.05.9 1.56 2.35 1.11 2.92.85.09-.66.35-1.11.64-1.37-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.38 9.38 0 0 1 12 7.12a9.4 9.4 0 0 1 2.5.35c1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.79-4.57 5.04.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.59.69.49A10.25 10.25 0 0 0 22 12.22C22 6.58 17.52 2 12 2Z"/></svg>
      </a>
    </div>
  </footer>
  <script src="{{ url('/assets/js/main.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
